<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Ride HUD</title>
  <style>
    /* The main UI's faces (resources/ui): Inter for text, Playfair Display
       for titles. Inter has no 700: bold text asks for 600. */
    @font-face { font-family: Inter; font-weight: 400; font-display: swap; src: url(fonts/inter-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: Inter; font-weight: 400; font-display: swap; src: url(fonts/inter-latin-ext-400-normal.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    @font-face { font-family: Inter; font-weight: 500; font-display: swap; src: url(fonts/inter-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: Inter; font-weight: 500; font-display: swap; src: url(fonts/inter-latin-ext-500-normal.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    @font-face { font-family: Inter; font-weight: 600; font-display: swap; src: url(fonts/inter-latin-600-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: Inter; font-weight: 600; font-display: swap; src: url(fonts/inter-latin-ext-600-normal.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    @font-face { font-family: "Playfair Display"; font-weight: 700; font-display: swap; src: url(fonts/playfair-display-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: "Playfair Display"; font-weight: 700; font-display: swap; src: url(fonts/playfair-display-latin-ext-700-normal.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    /* Clean noir, as the main UI (ui/src/tokens.stylex.ts): near-black
       panels, hairline rules, one blood red for actions and selection, brass
       only for money and experience. Square corners; motion only on change,
       since CEF paints the page on the CPU. */
    :root {
      --bg: #0b0b0c;
      --panel: #111112;
      --raised: #1a1a1b;
      --hover: #242425;
      --border: #2c2c2e;
      --border-strong: #4a4a4c;
      --line: #77746f;
      --text: #ece8e1;
      --soft: #c6c2bb;
      --muted: #9b9892;
      --faint: #64625e;
      --accent: #a3201c;
      --accent-hover: #c42b25;
      --accent-soft: rgba(163, 32, 28, .2);
      --red: #e0544d;
      --green: #7fb08a;
      --gold: #c9a45c;
      --gold-deep: #8a6d35;
      --blue: #8fb4d8;
      --glass: rgba(11, 11, 12, .86);
      --glass-light: rgba(11, 11, 12, .72);
      --ease: cubic-bezier(.2, .7, .2, 1);
      --serif: "Playfair Display", Georgia, serif;
      --sans: Inter, "Segoe UI", Arial, sans-serif;
      /* 13px at 800x600, 14px at 1080p, up to 28px at 4K. */
      font-size: clamp(13px, min(1.3vh, .95vw), 28px);
      font-family: var(--sans);
      color: var(--text);
      /* Lining figures: Playfair's default old-style ones jump about in
         numbers. A feature setting, since the font shorthand resets the
         variant properties. */
      font-feature-settings: "lnum" 1;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { pointer-events: none; user-select: none; }
    body.menu-open { pointer-events: auto; }
    b, strong { font-weight: 600; }
    button, input { font-family: inherit; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .shadow { text-shadow: 0 1px 2px #000, 0 0 8px rgba(0, 0, 0, .55); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); }
    ::selection { background: rgba(163, 32, 28, .7); color: #fff; }

    /* Toasts */
    #toasts { position: fixed; top: clamp(14px, 4vh, 44px); left: 50%; transform: translateX(-50%); width: min(37rem, calc(100vw - 2rem)); display: flex; flex-direction: column; gap: .55rem; }
    .toast { --tone: var(--soft); --tone-bg: rgba(198, 194, 187, .1); --tone-edge: rgba(198, 194, 187, .4); position: relative; display: grid; grid-template-columns: 2.5rem minmax(0, 1fr); gap: .9rem; align-items: start; padding: .95rem 1.25rem 1.05rem 1rem; background: rgba(14, 14, 15, .94); border: 1px solid var(--border); border-radius: 3px; box-shadow: 0 .6rem 1.6rem rgba(0, 0, 0, .45); overflow: hidden; animation: drop .2s var(--ease); transition: opacity .35s, transform .35s; }
    .toast.leaving { opacity: 0; transform: translateY(-.35rem); }
    .toast .icon { display: grid; place-items: center; width: 2.5rem; height: 2.5rem; border-radius: 50%; background: var(--tone-bg); border: 1px solid var(--tone-edge); color: var(--tone); }
    .toast .icon svg { width: 1.4rem; height: 1.4rem; }
    .toast .copy { min-width: 0; padding-top: .1rem; }
    .toast .title { display: flex; align-items: baseline; gap: .5rem; margin: 0 0 .28rem; color: var(--tone); font: 600 .8rem/1.25 var(--sans); letter-spacing: .14em; text-transform: uppercase; }
    .toast .count { padding: 0 .35rem; border-radius: 2px; background: var(--raised); color: var(--muted); font: 600 .65rem/1.5 var(--sans); letter-spacing: 0; }
    .toast .body { margin: 0; color: var(--text); font: 400 1.08rem/1.45 var(--sans); }
    .toast .time { position: absolute; left: 0; bottom: 0; width: 100%; height: 3px; background: var(--tone); opacity: .55; transform-origin: left; animation: toast-time linear forwards; }
    .toast.good { --tone: var(--green); --tone-bg: rgba(127, 176, 138, .14); --tone-edge: rgba(127, 176, 138, .5); }
    .toast.bad { --tone: var(--red); --tone-bg: rgba(224, 84, 77, .14); --tone-edge: rgba(224, 84, 77, .5); }
    .toast.gold { --tone: var(--gold); --tone-bg: rgba(201, 164, 92, .14); --tone-edge: rgba(201, 164, 92, .5); }
    @keyframes toast-time { to { transform: scaleX(0); } }
    @keyframes drop { from { opacity: 0; transform: translateY(-.35rem); } }

    /* Shop and bar counter: every offer listed, the selected one marked. Sits
       above the native key prompts, which rise up to 140 px off the bottom. */
    #counter { position: fixed; left: 50%; bottom: 156px; transform: translateX(-50%); width: min(27rem, calc(100vw - 2rem)); background: rgba(14, 14, 15, .95); border: 1px solid var(--border); border-radius: 3px; box-shadow: 0 1rem 2.4rem rgba(0, 0, 0, .55); overflow: hidden; animation: rise .2s var(--ease); }
    #counter header { display: flex; align-items: center; gap: .8rem; padding: .9rem 1.1rem .8rem; border-bottom: 1px solid var(--border); }
    #counter .mark { display: grid; place-items: center; flex: none; width: 2.3rem; height: 2.3rem; border: 1px solid var(--border-strong); color: var(--gold); font: 700 .95rem/1 var(--serif); }
    #counter h3 { margin: 0; font: 700 1.15rem/1.15 var(--serif); color: var(--text); }
    #counter .tagline { margin: .15rem 0 0; color: var(--muted); font: 400 .78rem/1.3 var(--sans); }
    #counter .cash { margin-left: auto; text-align: right; color: var(--muted); font: 600 .62rem/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; }
    #counter .cash b { display: block; margin-top: .15rem; color: var(--gold); font: 700 1.05rem/1 var(--serif); letter-spacing: 0; font-variant-numeric: lining-nums tabular-nums; }
    #counter ol { margin: 0; padding: .35rem 0; list-style: none; max-height: 16.5rem; overflow: hidden; }
    #counter li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .1rem 1rem; padding: .5rem 1.1rem .5rem 1rem; border-left: 3px solid transparent; }
    #counter li .name { color: var(--soft); font: 500 .92rem/1.3 var(--sans); }
    #counter li .price { color: var(--soft); font: 600 .88rem/1.3 var(--sans); text-align: right; font-variant-numeric: tabular-nums; }
    #counter li .note { grid-column: 1 / -1; color: var(--muted); font: 400 .76rem/1.35 var(--sans); }
    #counter li.selected { background: var(--raised); border-left-color: var(--accent-hover); }
    #counter li.selected .name { color: var(--text); }
    #counter li.selected .price { color: var(--gold); }
    #counter li.selected .note { color: var(--soft); }
    #counter li.short .price { color: var(--red); }
    #counter footer { display: flex; align-items: center; gap: 1.2rem; padding: .65rem 1.1rem .7rem; border-top: 1px solid var(--border); background: rgba(255, 255, 255, .02); color: var(--muted); font: 500 .76rem/1 var(--sans); }
    #counter kbd { display: inline-block; min-width: 1.6rem; margin-right: .4rem; padding: .25rem .4rem; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 3px; color: var(--text); font: 600 .72rem/1 var(--sans); text-align: center; }
    #counter footer .buy kbd { border-color: var(--accent-hover); color: #fff; background: var(--accent); }
    #counter footer .short { margin-left: auto; color: var(--red); }
    @keyframes rise { from { opacity: 0; transform: translate(-50%, .4rem); } }

    /* Kill feed */
    /* Positions cap in rem, not px, so they grow with the text at 4K. */
    #feed { position: fixed; top: clamp(120px, 17vh, 12rem); right: clamp(14px, 2vw, 32px); width: min(30rem, 42vw); display: flex; flex-direction: column; gap: .2rem; align-items: flex-end; }
    .feed-line { max-width: 100%; padding: .3rem .7rem .32rem; background: var(--glass-light); border-right: 2px solid var(--line); font: 500 .8rem/1.35 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: slide .18s var(--ease); transition: opacity .6s; }
    .feed-line.kill, .feed-line.death, .feed-line.bounty, .feed-line.duel { border-right-color: var(--accent-hover); }
    .feed-line.race, .feed-line.record, .feed-line.level, .feed-line.pay, .feed-line.stash { border-right-color: var(--gold); }
    .feed-line.event, .feed-line.medic, .feed-line.farm, .feed-line.rum { border-right-color: var(--green); }
    .feed-line.police { border-right-color: var(--blue); }
    .feed-line.join, .feed-line.leave { border-right-color: var(--faint); }
    .feed-line.fading { opacity: 0; }
    @keyframes slide { from { opacity: 0; transform: translateX(.6rem); } }

    /* Activity cards */
    #cards { position: fixed; top: clamp(290px, 40vh, 30rem); right: clamp(14px, 2vw, 32px); width: min(21rem, 40vw); max-height: calc(100vh - clamp(290px, 40vh, 30rem) - .75rem); overflow: hidden; display: flex; flex-direction: column; gap: .5rem; }
    .card { background: var(--glass); border: 1px solid var(--border); border-top: 2px solid var(--line); box-shadow: 0 .5rem 1.5rem rgba(0, 0, 0, .35); animation: slide .18s var(--ease); }
    .card.gold { border-top-color: var(--gold); } .card.bad { border-top-color: var(--accent-hover); } .card.good { border-top-color: var(--green); }
    .card .inside { padding: .7rem .9rem .75rem; }
    .card h3 { margin: 0; color: var(--text); font: 700 1.08rem/1.2 var(--serif); }
    .card .sub { margin: .2rem 0 0; color: var(--muted); font: 400 .76rem/1.35 var(--sans); }
    .card .row { display: flex; justify-content: space-between; align-items: baseline; gap: .75rem; padding: .32rem 0; border-top: 1px solid rgba(236, 232, 225, .08); color: var(--muted); font: 400 .78rem/1.3 var(--sans); }
    .card .sub + .row, .card h3 + .row { margin-top: .5rem; }
    .card .row b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
    .card.gold .row b { color: var(--gold); }
    .card .bar { height: 3px; background: rgba(236, 232, 225, .08); }
    .card .bar span { display: block; height: 100%; background: var(--text); transition: width .5s linear; }
    .card.gold .bar span { background: var(--gold); } .card.bad .bar span { background: var(--accent-hover); } .card.good .bar span { background: var(--green); }

    /* Race panel */
    #race { position: fixed; left: clamp(14px, 2vw, 32px); top: 50%; transform: translateY(-50%); width: min(17rem, 34vw); background: var(--glass); border: 1px solid var(--border); border-left: 3px solid var(--accent); box-shadow: 0 .5rem 1.5rem rgba(0, 0, 0, .4); }
    #race .inside { padding: .8rem 1rem .85rem; }
    #race .route { margin: 0; color: var(--muted); font: 600 .68rem/1.3 var(--sans); letter-spacing: .18em; text-transform: uppercase; overflow-wrap: anywhere; }
    #race .place { display: flex; align-items: baseline; gap: .35rem; margin: .35rem 0 .15rem; font-family: var(--serif); }
    #race .place b { color: var(--text); font-size: 3rem; font-weight: 700; line-height: 1; }
    #race .place span { color: var(--muted); font-size: 1.15rem; font-weight: 700; }
    #race .time { color: var(--text); font: 600 1.4rem/1.1 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
    #race .meta { display: flex; justify-content: space-between; gap: .5rem; margin: .45rem 0 .6rem; color: var(--muted); font: 400 .72rem/1.3 var(--sans); font-variant-numeric: tabular-nums; }
    #race ol { margin: 0 -.4rem; padding: .45rem 0 0; list-style: none; border-top: 1px solid var(--border); }
    #race li { display: flex; justify-content: space-between; gap: .5rem; padding: .18rem .4rem; color: var(--soft); font: 400 .8rem/1.35 var(--sans); font-variant-numeric: tabular-nums; }
    #race li.you { color: var(--text); font-weight: 600; background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent-hover); }

    /* Voice */
    #voice { position: fixed; left: clamp(14px, 2vw, 32px); bottom: clamp(140px, 22vh, 220px); display: flex; flex-direction: column; align-items: flex-start; gap: .2rem; }
    .speaker { display: flex; align-items: center; gap: .5rem; padding: .28rem .7rem .28rem .5rem; background: var(--glass-light); border-left: 2px solid var(--green); font: 500 .8rem/1.2 var(--sans); animation: slide .18s var(--ease); }
    /* Steady: a pulse repainted the page every frame while anyone talked. */
    .speaker i { width: .45rem; height: .45rem; flex: none; background: var(--green); box-shadow: 0 0 .4rem rgba(127, 176, 138, .7); }

    /* Level strip */
    #xp { position: fixed; left: 50%; bottom: clamp(10px, 2.2vh, 22px); transform: translateX(-50%); display: flex; align-items: center; gap: .7rem; padding: .35rem .85rem .35rem .35rem; background: var(--glass); border: 1px solid var(--border); white-space: nowrap; }
    #xp .badge { display: grid; place-items: center; width: 2rem; height: 2rem; border: 1px solid var(--gold); background: rgba(201, 164, 92, .1); color: var(--gold); font: 600 .9rem/1 var(--sans); font-variant-numeric: tabular-nums; }
    #xp .rank { min-width: 6rem; color: var(--text); font: 600 .7rem/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; }
    #xp .track { width: clamp(80px, 14vw, 15rem); height: 3px; background: rgba(236, 232, 225, .1); }
    #xp .track span { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); transition: width .6s ease-out; }
    #xp .numbers { color: var(--muted); font: 500 .68rem/1 var(--sans); font-variant-numeric: tabular-nums; }
    #gain { position: fixed; left: 50%; bottom: calc(clamp(10px, 2.2vh, 22px) + 3.5rem); transform: translateX(-50%); padding: .4rem .8rem; background: var(--glass-light); border-bottom: 2px solid var(--gold); color: var(--gold); font: 600 .9rem/1 var(--sans); letter-spacing: .06em; white-space: nowrap; text-shadow: 0 1px 2px #000; opacity: 0; transition: opacity .3s, transform .3s; }
    #gain.show { opacity: 1; transform: translate(-50%, -.35rem); }

    /* Shared by the menu */
    .seal { display: grid; place-items: center; flex: none; width: 2.75rem; height: 2.75rem; border: 1px solid var(--line); box-shadow: inset 0 0 0 3px var(--panel), inset 0 0 0 4px var(--border-strong); color: var(--text); font: 700 .95rem/1 var(--serif); letter-spacing: .02em; }
    .menu h2 { margin: 0; color: var(--text); font: 700 1.75rem/1.05 var(--serif); }
    .eyebrow { margin: 0 0 .3rem; color: var(--muted); font: 600 .66rem/1.2 var(--sans); letter-spacing: .22em; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: .55rem .75rem; color: var(--muted); font: 600 .66rem/1 var(--sans); letter-spacing: .16em; text-align: left; text-transform: uppercase; white-space: nowrap; border-bottom: 1px solid var(--border-strong); }
    td { padding: .5rem .75rem; border-bottom: 1px solid var(--border); color: var(--soft); font: 400 .86rem/1.35 var(--sans); vertical-align: middle; }
    td:first-child { color: var(--text); font-weight: 500; }
    td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    tr.you td { background: var(--accent-soft); }
    tr.you td:first-child { box-shadow: inset 3px 0 0 var(--accent-hover); }
    .tag { font-weight: 600; margin-right: .35rem; }
    /* The players page colours its level box inline for the old paper. */
    .lvl { display: inline-block; min-width: 1.8rem; margin-right: .45rem; padding: .18rem .3rem; border: 1px solid var(--border-strong) !important; color: var(--gold) !important; font: 600 .68rem/1 var(--sans); font-variant-numeric: tabular-nums; text-align: center; }
    .bounty { color: var(--red); font-weight: 600; }

    /* City menu */
    #menu { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(6, 6, 7, .55); pointer-events: auto; }
    .menu { width: min(74rem, calc(100vw - 2rem)); height: min(48rem, calc(100vh - 2rem)); display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; background: var(--bg); color: var(--text); border: 1px solid var(--line); box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .6); animation: rise .18s var(--ease); }
    @keyframes rise { from { opacity: 0; transform: translateY(.25rem); } }
    .menu header { display: flex; align-items: center; gap: 1rem; min-width: 0; padding: 1.1rem 1.5rem 1rem; background: var(--panel); border-bottom: 3px double var(--line); }
    .menu .wallet { margin-left: auto; min-width: 0; color: var(--muted); font: 400 .78rem/1.35 var(--sans); text-align: right; }
    .menu .wallet b { display: block; margin-bottom: .2rem; color: var(--gold); font: 700 1.6rem/1 var(--serif); font-variant-numeric: tabular-nums lining-nums; }
    nav { display: flex; gap: .15rem; padding: 0 1rem; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--border); scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    nav button { flex: none; display: flex; align-items: baseline; padding: .75rem .85rem .7rem; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; color: var(--muted); font: 600 .72rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; cursor: pointer; outline: none; transition: color .12s var(--ease), background-color .12s var(--ease); }
    nav button:hover { color: var(--text); background: var(--raised); }
    nav button:focus-visible { color: var(--text); box-shadow: inset 0 -2px 0 var(--line); }
    nav button.active { color: var(--text); border-bottom-color: var(--accent-hover); }
    nav button kbd { margin-right: .45rem; color: var(--faint); font: 500 .66rem/1 var(--sans); letter-spacing: 0; font-variant-numeric: tabular-nums; }
    nav button.active kbd { color: var(--accent-hover); }
    .page { overflow-y: auto; padding: 1.25rem 1.5rem 1.4rem; scrollbar-color: var(--border-strong) transparent; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(19rem, 100%), 1fr)); gap: 1rem; }
    .panel { min-width: 0; padding: .95rem 1.1rem 1.05rem; background: var(--panel); border: 1px solid var(--border); overflow-wrap: anywhere; }

<body>

  <section id="cards"></section>
  <section id="race" class="hidden"></section>
  <section id="voice"></section>
  <section id="xp" class="hidden">
    <span class="badge" id="xp-level">1</span>
    <span class="rank shadow" id="xp-rank">Greenhorn</span>

  <script>

    const state = {player: {spawned: false, alive: false, id: null}, hidden: false, profile: null, cards: new Map(), race: null,

    const XP_SHOW_MS = 6000;
    let xpShownUntil = 0;

    function applyVisibility() {

      document.getElementById("xp").classList.toggle("hidden", !onStreet || !state.profile || Date.now() >= xpShownUntil);

    /* Toasts */
    const ICONS = {

      bad: '<path d="M12 6.5v7M12 17v.5"/>',

    const toastNodes = new Map();
    on("toast", ({title, text, tone, seconds}) => {

      const kind = ICONS[tone] ? tone : "info";
      const key = `${kind}|${title ?? ""}|${text ?? ""}`;
      const life = Math.max(2, seconds ?? 5) * 1000;
      const known = toastNodes.get(key);
      if (known && known.node.isConnected && !known.node.classList.contains("leaving")) {

    /* Counter */

        el("ol", {}, lines),
        el("footer", {},
          card.lines.length > 1 ? el("span", {}, el("kbd", {}, (card.nextKey ?? "[N]").replace(/[\[\]]/g, "")), "Next") : null,
          el("span", {class: "buy"}, el("kbd", {}, (card.buyKey ?? "[B]").replace(/[\[\]]/g, "")), `${(card.action ?? "Buy").charAt(0)}${(card.action ?? "Buy").slice(1).toLowerCase()}`),

    /* Feed */

    // Cards update in place: only a new card slides in, so a timer ticking

    function renderCards() {

        el("div", {class: "meta"}, el("span", {}, race.finished ? "Finished" : `Checkpoint ${race.checkpoint} / ${race.total}`),

        el("ol", {}, (race.standings ?? []).map((entry) => el("li", {class: entry.you ? "you" : ""},

    let composeTarget = null;

      composeTarget = player;

    function renderMenu() {
      const box = document.getElementById("menu");
      box.classList.toggle("hidden", !state.menuOpen);
      document.body.classList.toggle("menu-open", state.menuOpen);
      if (!state.menuOpen) return;
      const data = state.data ?? {};
      const pages = {city: cityPage, homes: homesPage, jobs: jobsPage, races: racesPage, players: playersPage, crew: crewPage, leaders: leadersPage, help: helpPage};
      const keepScroll = box.querySelector(".page")?.scrollTop ?? 0;
      const active = document.activeElement;
      const activeId = active?.id;
      const activeValue = active?.value;
      box.replaceChildren(el("div", {class: "menu", role: "dialog", "aria-modal": "true"},
        el("header", {}, el("span", {class: "seal"}, "LH"),
          el("div", {}, el("p", {class: "eyebrow"}, "Lost Heaven · Free Ride"), el("h2", {}, "City Menu")),
          el("div", {class: "wallet"}, el("b", {}, money(data.you?.money)), data.you ? `${data.you.name} · Level ${data.you.level}` : "Loading…")),
        el("nav", {}, TABS.map(([id, label], index) => el("button", {type: "button", class: state.tab === id ? "active" : "", onclick: () => selectTab(id)},
          el("kbd", {}, index + 1), label))),
        el("div", {class: "page"}, state.data ? pages[state.tab](data) : empty("Asking around town…")),
        el("footer", {}, composeTarget
          ? el("div", {class: "compose"}, el("span", {}, `To ${composeTarget.name}:`),
            el("input", {id: "compose-text", maxlength: "120", placeholder: "Write a private message", onkeydown: (event) => {
              if (event.key === "Enter") sendCompose();
            }}), el("button", {class: "btn primary", type: "button", onclick: sendCompose}, "Send"),
            el("button", {class: "btn", type: "button", onclick: () => { composeTarget = null; renderMenu(); }}, "Cancel"))
          : [el("span", {}, "Every button runs the same command you could type in chat."),
            el("button", {class: "btn", type: "button", style: "margin-left:auto", onclick: () => send("hud:settings")}, "Settings"),
            el("span", {}, `Esc or ${keyLabel("f2")} to close`)])));
      const page = box.querySelector(".page");
      if (page) page.scrollTop = keepScroll;
      if (activeId) {
        const restored = document.getElementById(activeId);
        if (restored) { if (activeValue !== undefined) restored.value = activeValue; restored.focus(); }
      }

    function sendCompose() {
      const input = document.getElementById("compose-text");
      const text = input?.value.trim();
      if (composeTarget && text) command(`/pm #${composeTarget.id} ${text}`);
      composeTarget = null;
      renderMenu();
    }
    function selectTab(tab) {
      state.tab = tab;
      composeTarget = null;
      send("hud:tab", {tab});
      renderMenu();
    }
    on("menu:open", ({tab, keys}) => { state.menuOpen = true; if (tab) state.tab = tab; if (keys) state.keys = keys; renderMenu(); });
    on("menu:close", () => { state.menuOpen = false; composeTarget = null; renderMenu(); });
    on("menu:data", (data) => {
      state.data = data;
      const typing = document.activeElement?.tagName === "INPUT" && document.activeElement.value;
      if (!typing) renderMenu();
    });
    document.addEventListener("keydown", (event) => {
      if (!state.menuOpen) return;
      // F2 belongs to hud.ts's Key.bind, which sees it focused or not; also
      // closing here raced it and reopened the menu.
      if (event.key === "F2") { event.preventDefault(); return; }
      if (event.key === "Escape") { event.preventDefault(); send("hud:close"); return; }
      if (document.activeElement?.tagName === "INPUT") return;
      const index = Number(event.key) - 1;
      if (Number.isInteger(index) && TABS[index]) selectTab(TABS[index][0]);
    });
  </script>
</body>
</html>
