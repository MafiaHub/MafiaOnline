<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Ride HUD</title>
  <style>
    :root {
      --night: rgba(15, 18, 20, .9);
      --night-solid: #101416;
      --paper: #efe6d3;
      --paper-deep: #e3d6bc;
      --ink: #26261f;
      --ink-soft: #5e5c51;
      --gold: #e2b866;
      --gold-deep: #a8803f;
      --red: #d0574a;
      --red-deep: #8c342c;
      --green: #8fc27a;
      --blue: #8fb4d8;
      --muted: #b9ae98;
      --line: rgba(196, 160, 98, .55);
      --text: #f3e9d6;
      --serif: Georgia, 'Times New Roman', serif;
      --sans: Arial, Helvetica, sans-serif;
      font-family: var(--sans);
      color: var(--text);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { pointer-events: none; user-select: none; }
    body.menu-open { pointer-events: auto; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .shadow { text-shadow: 0 1px 2px #000, 0 0 10px rgba(0, 0, 0, .6); }

    /* Toasts */
    #toasts { position: fixed; top: clamp(14px, 4vh, 44px); left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .toast { width: 100%; padding: 11px 16px 12px 18px; background: var(--night); border: 1px solid var(--line); border-left: 4px solid var(--gold); box-shadow: 0 10px 30px rgba(0, 0, 0, .45); animation: drop .28s ease-out; transition: opacity .4s, transform .4s; }
    .toast.leaving { opacity: 0; transform: translateY(-6px); }
    .toast .title { margin: 0 0 3px; color: var(--gold); font: 700 10px/1.2 var(--sans); letter-spacing: .2em; text-transform: uppercase; }
    .toast .body { margin: 0; font: 14px/1.4 var(--sans); }
    .toast.good { border-left-color: var(--green); } .toast.good .title { color: var(--green); }
    .toast.bad { border-left-color: var(--red); } .toast.bad .title { color: var(--red); }
    .toast.gold { border-left-color: var(--gold); background: linear-gradient(90deg, rgba(64, 49, 22, .92), var(--night) 60%); }
    @keyframes drop { from { opacity: 0; transform: translateY(-10px); } }

    /* Kill feed */
    #feed { position: fixed; top: clamp(120px, 17vh, 170px); right: clamp(14px, 2vw, 32px); width: min(420px, 42vw); display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
    .feed-line { max-width: 100%; padding: 5px 11px; background: rgba(12, 14, 16, .72); border-right: 3px solid var(--line); font: 700 12px/1.35 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: slide .25s ease-out; transition: opacity .6s; }
    .feed-line.kill { border-right-color: var(--red); }
    .feed-line.race, .feed-line.record { border-right-color: var(--gold); }
    .feed-line.event { border-right-color: var(--green); }
    .feed-line.fading { opacity: 0; }
    @keyframes slide { from { opacity: 0; transform: translateX(12px); } }

    /* Activity cards */
    #cards { position: fixed; top: clamp(290px, 40vh, 420px); right: clamp(14px, 2vw, 32px); width: min(310px, 40vw); display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--night); border: 1px solid var(--line); border-top: 3px solid var(--gold); box-shadow: 0 10px 28px rgba(0, 0, 0, .45); animation: slide .25s ease-out; }
    .card.bad { border-top-color: var(--red); } .card.good { border-top-color: var(--green); }
    .card .inside { padding: 11px 14px 12px; }
    .card h3 { margin: 0; font: 18px/1.15 var(--serif); font-weight: normal; }
    .card .sub { margin: 3px 0 8px; color: var(--muted); font: italic 12px/1.3 var(--serif); }
    .card .row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-top: 1px dashed rgba(196, 160, 98, .25); font: 12px/1.3 var(--sans); }
    .card .row b { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
    .card .bar { height: 3px; background: rgba(255, 255, 255, .08); }
    .card .bar span { display: block; height: 100%; background: var(--gold); transition: width .5s linear; }
    .card.bad .bar span { background: var(--red); } .card.good .bar span { background: var(--green); }

    /* Race panel */
    #race { position: fixed; left: clamp(14px, 2vw, 32px); top: 50%; transform: translateY(-50%); width: min(250px, 34vw); background: var(--night); border: 1px solid var(--line); border-left: 4px solid var(--gold); box-shadow: 0 12px 32px rgba(0, 0, 0, .5); }
    #race .inside { padding: 12px 15px 13px; }
    #race .route { margin: 0; color: var(--gold); font: 700 10px/1.2 var(--sans); letter-spacing: .2em; text-transform: uppercase; }
    #race .place { display: flex; align-items: baseline; gap: 6px; margin: 6px 0 2px; font-family: var(--serif); }
    #race .place b { font-size: 46px; line-height: 1; font-weight: normal; }
    #race .place span { color: var(--muted); font-size: 18px; }
    #race .time { font: 700 22px/1.1 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
    #race .meta { display: flex; justify-content: space-between; margin: 7px 0 8px; color: var(--muted); font: 11px/1.3 var(--sans); }
    #race ol { margin: 0; padding: 7px 0 0; list-style: none; border-top: 1px solid rgba(196, 160, 98, .3); }
    #race li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; font: 12px/1.35 var(--sans); }
    #race li.you { color: var(--gold); font-weight: 700; }

    /* Voice */
    #voice { position: fixed; left: clamp(14px, 2vw, 32px); bottom: clamp(140px, 22vh, 220px); display: flex; flex-direction: column; gap: 4px; }
    .speaker { display: flex; align-items: center; gap: 7px; padding: 4px 10px 4px 7px; background: rgba(12, 14, 16, .72); border-left: 3px solid var(--green); font: 700 12px/1.2 var(--sans); animation: slide .2s ease-out; }
    .speaker i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1s ease-in-out infinite alternate; }
    @keyframes pulse { to { opacity: .35; } }

    /* Level strip */
    #xp { position: fixed; left: 50%; bottom: clamp(10px, 2.2vh, 22px); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: rgba(12, 14, 16, .7); border: 1px solid rgba(196, 160, 98, .35); }
    #xp .badge { display: grid; place-items: center; width: 30px; height: 30px; border: 2px solid var(--gold); border-radius: 50%; color: var(--gold); font: 700 12px/1 var(--sans); }
    #xp .rank { min-width: 92px; font: 13px/1 var(--serif); }
    #xp .track { width: clamp(120px, 16vw, 220px); height: 4px; background: rgba(255, 255, 255, .1); }
    #xp .track span { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); transition: width .6s ease-out; }
    #xp .numbers { color: var(--muted); font: 10px/1 var(--sans); font-variant-numeric: tabular-nums; }
    #gain { position: fixed; left: 50%; bottom: clamp(56px, 8vh, 80px); transform: translateX(-50%); color: var(--gold); font: 700 15px/1 var(--sans); letter-spacing: .06em; opacity: 0; transition: opacity .3s, transform .3s; }
    #gain.show { opacity: 1; transform: translate(-50%, -6px); }

    /* Shared by the menu */
    .seal { display: grid; place-items: center; flex: none; width: 42px; height: 42px; border: 2px solid var(--gold); border-radius: 50%; color: var(--gold); font: 700 12px/1 var(--serif); transform: rotate(-12deg); }
    .menu h2 { margin: 0; font: 26px/1 var(--serif); font-weight: normal; letter-spacing: -.02em; }
    .eyebrow { margin: 0 0 4px; color: var(--gold); font: 700 10px/1.2 var(--sans); letter-spacing: .22em; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 9px 12px; color: var(--gold); font: 700 10px/1 var(--sans); letter-spacing: .16em; text-align: left; text-transform: uppercase; border-bottom: 1px solid rgba(196, 160, 98, .3); }
    td { padding: 8px 12px; border-bottom: 1px solid rgba(255, 255, 255, .05); font: 13px/1.3 var(--sans); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr.you td { background: rgba(226, 184, 102, .1); }
    .tag { font-weight: 700; margin-right: 6px; }
    .lvl { display: inline-block; min-width: 26px; margin-right: 6px; padding: 2px 4px; border: 1px solid var(--line); color: var(--gold); font: 700 10px/1 var(--sans); text-align: center; }
    .bounty { color: var(--red); font-weight: 700; }

    /* City menu */
    #menu { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, .35); pointer-events: auto; }
    .menu { width: min(1040px, calc(100vw - 32px)); height: min(680px, calc(100vh - 32px)); display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; background: var(--paper); color: var(--ink); border: 1px solid #f7efdd; box-shadow: 0 30px 80px rgba(0, 0, 0, .7), inset 0 0 0 6px var(--paper-deep); }
    .menu header { display: flex; align-items: center; gap: 14px; padding: 18px 24px 14px; border-bottom: 2px solid #404036; }
    .menu .seal { border-color: var(--red-deep); color: var(--red-deep); }
    .menu .eyebrow { color: var(--red-deep); }
    .menu .wallet { margin-left: auto; text-align: right; font: 12px/1.35 var(--sans); color: var(--ink-soft); }
    .menu .wallet b { display: block; color: var(--ink); font: 24px/1 var(--serif); font-weight: normal; }
    nav { display: flex; gap: 2px; padding: 0 18px; background: var(--paper-deep); border-bottom: 1px solid #b9ab8c; }
    nav button { padding: 11px 14px 10px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--ink-soft); font: 700 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
    nav button:hover { color: var(--ink); }
    nav button.active { color: var(--red-deep); border-bottom-color: var(--red-deep); }
    nav button kbd { margin-right: 6px; color: #9a8f77; font: 10px var(--sans); }
    .page { overflow-y: auto; padding: 18px 24px 22px; scrollbar-color: #a48b61 var(--paper-deep); }
    .page th { color: var(--red-deep); border-bottom-color: #b9ab8c; }
    .page td { border-bottom-color: #e1d5ba; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .panel { min-width: 0; padding: 14px 16px; background: #f7f0e1; border: 1px solid #d4c6a6; overflow-wrap: anywhere; }
    .panel h3 { margin: 0 0 10px; color: var(--red-deep); font: 700 10px/1.2 var(--sans); letter-spacing: .18em; text-transform: uppercase; }
    .panel p { margin: 0 0 8px; font: 13px/1.45 var(--sans); color: #3c3b33; }
    .panel .big { font: 22px/1.15 var(--serif); color: var(--ink); }
    .line { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid #e1d5ba; font: 13px/1.35 var(--sans); }
    .line:first-of-type { border-top: 0; }
    .line .what { min-width: 0; flex: 1; }
    .line .what b { display: block; font: 15px/1.2 var(--serif); font-weight: normal; color: var(--ink); }
    .line .what small { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 11px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; flex: none; }
    .btn { padding: 7px 11px; border: 1px solid #8c7b58; background: transparent; color: var(--ink); font: 700 10px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
    .btn:hover { background: #e7dbc0; }
    .btn.primary { background: var(--red-deep); border-color: var(--red-deep); color: #fff4de; }
    .btn.primary:hover { filter: brightness(1.15); }
    .btn:disabled { opacity: .45; cursor: default; }
    .empty { color: var(--ink-soft); font: italic 13px/1.4 var(--serif); }
    .meter { height: 5px; margin: 8px 0 4px; background: #d8cbad; }
    .meter span { display: block; height: 100%; background: var(--red-deep); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .stats div { padding: 8px; background: #efe5d0; text-align: center; font: 10px/1.3 var(--sans); color: var(--ink-soft); letter-spacing: .08em; text-transform: uppercase; }
    .stats b { display: block; color: var(--ink); font: 20px/1.1 var(--serif); letter-spacing: 0; text-transform: none; }
    .form { display: flex; gap: 8px; margin-top: 8px; }
    .form input { min-width: 0; flex: 1; padding: 8px 9px; border: 1px solid #ac9d7c; background: #fbf6ec; color: var(--ink); font: 13px var(--sans); outline: none; }
    .form input:focus { border-color: var(--red-deep); }
    .lb ol { margin: 0; padding: 0; list-style: none; counter-reset: lb; }
    .lb li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid #e1d5ba; font: 13px/1.3 var(--sans); counter-increment: lb; }
    .lb li::before { content: counter(lb) "."; width: 22px; color: var(--ink-soft); }
    .lb li span { flex: 1; }
    .cmd { display: grid; grid-template-columns: minmax(0, 42%) minmax(0, 1fr); gap: 10px; padding: 6px 0; border-top: 1px solid #e1d5ba; font: 12px/1.4 var(--sans); }
    /* Usages wrap after "|" (see usage()), and anywhere as a last resort. */
    .cmd code { min-width: 0; color: var(--red-deep); font: 12px Consolas, monospace; overflow-wrap: anywhere; }
    .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font: 13px/1.4 var(--sans); }
    .keys kbd { padding: 3px 7px; border: 1px solid #8c7b58; font: 700 11px var(--sans); text-align: center; }
    .menu footer { display: flex; align-items: center; gap: 10px; padding: 10px 24px; border-top: 1px solid #b9ab8c; background: var(--paper-deep); color: var(--ink-soft); font: 11px/1.3 var(--sans); }
    .menu footer .compose { display: flex; gap: 8px; flex: 1; }
    .menu footer input { flex: 1; padding: 7px 9px; border: 1px solid #ac9d7c; background: #fbf6ec; font: 13px var(--sans); outline: none; }
    .pill { display: inline-block; padding: 2px 6px; margin-left: 6px; border: 1px solid currentColor; font: 700 9px/1.2 var(--sans); letter-spacing: .08em; text-transform: uppercase; vertical-align: 2px; }
    .pill.red { color: var(--red-deep); } .pill.gold { color: var(--gold-deep); } .pill.green { color: #4d7a3d; }
    @media (max-width: 760px) {
      #feed { width: 60vw; } #cards { width: 52vw; } #race { width: 44vw; }
      .menu header { padding: 12px 14px; } .page { padding: 12px 14px; } nav { padding: 0 8px; overflow-x: auto; }
      nav button kbd { display: none; } .cmd { grid-template-columns: 1fr; gap: 2px; }
    }
  </style>
</head>
<body>
  <section id="toasts" aria-live="polite"></section>
  <section id="feed"></section>
  <section id="cards"></section>
  <section id="race" class="hidden"></section>
  <section id="voice"></section>
  <section id="xp" class="hidden">
    <span class="badge" id="xp-level">1</span>
    <span class="rank shadow" id="xp-rank">Greenhorn</span>
    <span class="track"><span id="xp-fill" style="width:0%"></span></span>
    <span class="numbers" id="xp-numbers">0 / 100 XP</span>
  </section>
  <div id="gain"></div>
  <section id="menu" class="hidden"></section>

  <script>
    const TABS = [["city", "City"], ["jobs", "Jobs"], ["races", "Races"], ["players", "Players"], ["crew", "Crew"], ["leaders", "Leaders"], ["help", "Help"]];
    const state = {player: {spawned: false, alive: false, id: null}, hidden: false, profile: null, cards: new Map(), race: null,
      raceAt: 0, speakers: new Map(), menuOpen: false, tab: "city", data: null, compose: null};

    function send(name, payload = {}) {
      if (typeof callEvent === "function") callEvent(name, JSON.stringify(payload));
    }
    function command(text) { send("hud:command", {text}); }
    function on(name, handler) { window.addEventListener(name, ({detail}) => handler(detail ?? {})); }
    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs)) {
        if (value === null || value === undefined || value === false) continue;
        if (key === "class") node.className = value;
        else if (key === "style") node.style.cssText = value;
        else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
        else node.setAttribute(key, value === true ? "" : value);
      }
      for (const child of children.flat(Infinity)) if (child !== null && child !== undefined && child !== false) node.append(child instanceof Node ? child : String(child));
      return node;
    }
    const money = (value) => `$${Math.round(value ?? 0).toLocaleString("en-US")}`;
    const clock = (ms) => {
      const total = Math.max(0, Math.floor(ms / 10));
      return `${Math.floor(total / 6000)}:${String(Math.floor(total / 100) % 60).padStart(2, "0")}.${String(total % 100).padStart(2, "0")}`;
    };
    const minutes = (seconds) => `${Math.floor(seconds / 60)}:${String(Math.max(0, seconds) % 60).padStart(2, "0")}`;

    function applyVisibility() {
      const onStreet = state.player.spawned && !state.hidden;
      document.getElementById("xp").classList.toggle("hidden", !onStreet || !state.profile);
      document.getElementById("cards").classList.toggle("hidden", !onStreet);
      document.getElementById("feed").classList.toggle("hidden", state.hidden);
      document.getElementById("voice").classList.toggle("hidden", state.hidden);
      document.getElementById("race").classList.toggle("hidden", !onStreet || !state.race?.active);
    }

    /* Toasts */
    on("toast", ({title, text, tone, seconds}) => {
      const box = document.getElementById("toasts");
      const node = el("div", {class: `toast ${tone ?? "info"}`}, title ? el("p", {class: "title"}, title) : null, el("p", {class: "body"}, text ?? ""));
      box.prepend(node);
      while (box.children.length > 4) box.lastChild.remove();
      setTimeout(() => { node.classList.add("leaving"); setTimeout(() => node.remove(), 400); }, Math.max(2, seconds ?? 5) * 1000);
    });

    /* Feed */
    on("feed", ({kind, parts}) => {
      const box = document.getElementById("feed");
      const node = el("div", {class: `feed-line shadow ${kind ?? ""}`}, (parts ?? []).map((part) => el("span", {style: `color:${part.c ?? "#f3e9d6"}`}, part.t)));
      box.append(node);
      while (box.children.length > 6) box.firstChild.remove();
      setTimeout(() => { node.classList.add("fading"); setTimeout(() => node.remove(), 600); }, 9000);
    });

    /* Cards */
    // Cards update in place: only a new card slides in, so a timer ticking
    // on a card does not replay its entrance every second.
    const cardNodes = new Map();
    function renderCards() {
      const box = document.getElementById("cards");
      for (const [id, node] of cardNodes) if (!state.cards.has(id)) { node.remove(); cardNodes.delete(id); }
      for (const [id, {data}] of state.cards) {
        let node = cardNodes.get(id);
        if (!node) {
          node = el("div");
          cardNodes.set(id, node);
          box.append(node);
        }
        node.className = `card ${data.tone ?? ""}`;
        const width = typeof data.progress === "number" ? Math.round(data.progress * 100) : null;
        const bar = node.querySelector(".bar span");
        // replaceChildren would print a null argument as text.
        node.replaceChildren(...[el("div", {class: "inside"},
          el("h3", {}, data.title ?? ""), data.subtitle ? el("p", {class: "sub"}, data.subtitle) : null,
          (data.rows ?? []).map(([label, value]) => el("div", {class: "row"}, el("span", {}, label), el("b", {}, value)))),
          width === null ? null : el("div", {class: "bar"}, bar ?? el("span"))].filter(Boolean));
        if (width !== null) node.querySelector(".bar span").style.width = `${width}%`;
      }
    }
    on("card", (data) => {
      if (!data.id) return;
      if (data.remove) state.cards.delete(data.id);
      else state.cards.set(data.id, {data, expiresAt: data.seconds ? Date.now() + data.seconds * 1000 : 0});
      renderCards();
    });
    setInterval(() => {
      let changed = false;
      for (const [id, entry] of state.cards) if (entry.expiresAt && entry.expiresAt < Date.now()) { state.cards.delete(id); changed = true; }
      if (changed) renderCards();
    }, 1000);

    /* Race */
    function renderRace() {
      const box = document.getElementById("race");
      const race = state.race;
      applyVisibility();
      if (!race?.active) return;
      const elapsed = race.finished ? race.elapsedMs : race.elapsedMs + (Date.now() - state.raceAt);
      box.replaceChildren(el("div", {class: "inside"},
        el("p", {class: "route"}, race.route),
        el("div", {class: "place"}, el("b", {}, race.place), el("span", {}, `/ ${race.racers}`)),
        el("div", {class: "time", id: "race-time"}, clock(elapsed)),
        el("div", {class: "meta"}, el("span", {}, race.finished ? "Finished" : `Checkpoint ${race.checkpoint} / ${race.total}`),
          el("span", {}, race.record ? `Record ${clock(race.record.ms)}` : "No record yet")),
        el("ol", {}, (race.standings ?? []).map((entry) => el("li", {class: entry.you ? "you" : ""},
          el("span", {}, `${entry.place}. ${entry.name}`), el("span", {}, entry.finishedMs !== null ? clock(entry.finishedMs) : ""))))));
    }
    on("race", (race) => { state.race = race; state.raceAt = Date.now(); renderRace(); });
    function tickRace() {
      const node = document.getElementById("race-time");
      if (node && state.race?.active && !state.race.finished) node.textContent = clock(state.race.elapsedMs + (Date.now() - state.raceAt));
      requestAnimationFrame(tickRace);
    }
    requestAnimationFrame(tickRace);

    /* Voice */
    on("voice", ({id, name, talking}) => {
      if (talking) state.speakers.set(id, name); else state.speakers.delete(id);
      document.getElementById("voice").replaceChildren(...[...state.speakers.values()].map((speaker) => el("div", {class: "speaker shadow"}, el("i"), speaker)));
    });

    /* Level strip */
    on("profile", (profile) => {
      state.profile = profile;
      document.getElementById("xp-level").textContent = profile.level ?? 1;
      document.getElementById("xp-rank").textContent = profile.rank ?? "";
      const span = Math.max(1, profile.levelSpan ?? 100);
      document.getElementById("xp-fill").style.width = `${Math.min(100, Math.round((profile.levelXp ?? 0) / span * 100))}%`;
      document.getElementById("xp-numbers").textContent = `${profile.levelXp ?? 0} / ${span} XP`;
      applyVisibility();
    });
    let gainTimer = null;
    on("xp", ({amount, reason}) => {
      const gain = document.getElementById("gain");
      gain.textContent = `+${amount} XP${reason ? ` · ${reason}` : ""}`;
      gain.classList.add("show");
      clearTimeout(gainTimer);
      gainTimer = setTimeout(() => gain.classList.remove("show"), 2600);
    });
    on("levelup", () => {
      const badge = document.getElementById("xp-level");
      badge.animate([{transform: "scale(1)"}, {transform: "scale(1.5)"}, {transform: "scale(1)"}], {duration: 700});
    });

    on("player", (player) => { state.player = player; applyVisibility(); if (!player.spawned) { state.cards.clear(); renderCards(); } });
    on("visibility", ({hidden}) => { state.hidden = Boolean(hidden); applyVisibility(); });
    on("reset", () => { state.cards.clear(); state.race = null; state.speakers.clear(); renderCards(); renderRace(); document.getElementById("voice").replaceChildren(); });

    function crewTag(crew) { return crew ? el("span", {class: "tag", style: `color:${crew.color}`}, `[${crew.tag}]`) : null; }

    /* City menu */
    function button(label, text, primary = false, disabled = false) {
      return el("button", {class: `btn${primary ? " primary" : ""}`, type: "button", disabled, onclick: () => command(text)}, label);
    }
    function line(title, detail, ...actions) {
      return el("div", {class: "line"}, el("div", {class: "what"}, el("b", {}, title), detail ? el("small", {}, detail) : null), el("div", {class: "actions"}, actions));
    }
    function panel(heading, ...children) { return el("section", {class: "panel"}, el("h3", {}, heading), children); }
    function empty(text) { return el("p", {class: "empty"}, text); }

    function cityPage(data) {
      const you = data.you ?? {};
      const invites = data.players?.invites ?? [];
      const event = data.event ?? {};
      const lobbies = (data.races?.races ?? []).filter((race) => race.phase === "lobby");
      const bounties = data.bounties ?? [];
      return el("div", {class: "grid"},
        panel("Your standing",
          el("p", {class: "big"}, `Level ${you.level ?? 1} · ${you.rank ?? ""}`),
          el("div", {class: "meter"}, el("span", {style: `width:${Math.round((you.levelXp ?? 0) / Math.max(1, you.levelSpan ?? 1) * 100)}%`})),
          el("p", {}, `${you.levelXp ?? 0} of ${you.levelSpan ?? 100} XP to the next level`),
          el("div", {class: "actions"}, button("My cars", "/garage", true), button("Car lot", "/dealer"), button("My stats", "/stats"))),
        invites.length ? panel("Invitations", invites.map((invite) => line(invite.from, invite.summary,
          button("Accept", `/accept ${invite.id}`, true), button("Decline", `/decline ${invite.id}`)))) : null,
        panel("City event", event.kind
          ? [el("p", {class: "big"}, event.title), el("p", {}, `${event.detail} · ends in ${minutes(event.secondsLeft)}`), button("Show me", "/event", true)]
          : el("p", {}, `Quiet streets. The next event comes in about ${minutes(event.nextInSeconds ?? 0)}.`)),
        panel("Races taking entries", lobbies.length ? lobbies.map((race) => line(race.route, `${race.host} · ${race.racers.length} racer${race.racers.length === 1 ? "" : "s"} · starts in ${race.secondsLeft} s`,
          race.joined ? button("Leave", "/race leave") : button("Join", `/race join ${race.id}`, true))) : [empty("No lobby is open."), button("Open a race", "/race start", true)]),
        panel("Bounties", bounties.length ? bounties.map((bounty) => line(bounty.name, bounty.reason === "police" ? "Wanted by the police" : "Kill streak",
          el("span", {class: "pill red"}, money(bounty.amount)), bounty.id === state.player.id ? null : button("Hunt", `/hunt #${bounty.id}`))) : empty("Nobody has a price on their head.")),
        panel("Map", (data.maps?.maps ?? []).map((map) => line(map.title,
          map.id === data.maps.current ? "Playing now" : !map.available ? "Not installed on this server" : `${map.votes} of ${data.maps.needed} votes`,
          map.id === data.maps.current || !map.available ? null : button(map.yours ? "Voted" : "Vote", `/map ${map.id}`, !map.yours, map.yours)))),
        (data.places ?? []).length ? panel("Around town", data.places.map((place) => line(place.name, place.offers.join(" · ")))) : null);
    }

    function jobsPage(data) {
      const exportList = data.export;
      const duty = data.duty ?? {};
      const taxi = data.taxi ?? {};
      const stashes = data.stashes ?? {found: 0, total: 30};
      return el("div", {class: "grid"},
        panel("Lucas's export list", exportList
          ? [el("p", {}, `Take these from the traffic and bring them to ${exportList.yard ?? "the export yard"}. ${money(exportList.pay)} each, a bonus for the full list. New list in ${exportList.minutesLeft} min.`),
            exportList.models.map((entry) => line(entry.name ?? entry.model, entry.deliveredBy ? `Delivered by ${entry.deliveredBy}` : "Wanted",
              entry.deliveredBy ? el("span", {class: "pill green"}, "Done") : el("span", {class: "pill gold"}, money(exportList.pay))))]
          : empty("Lucas is drawing up a list.")),
        panel("Police duty",
          el("p", {}, "Put on the uniform, take a squad car and bring down wanted players and bounty targets. Shoot a citizen and you lose the badge."),
          el("p", {}, `${duty.officers ?? 0} on duty · ${duty.suspects ?? 0} suspect${duty.suspects === 1 ? "" : "s"} in town`),
          button(duty.onDuty ? "Clock off" : "Go on duty", "/duty", !duty.onDuty)),
        panel("Taxi",
          el("p", {}, "Take calls from street corners and drive fares across town. Quick drivers earn tips."),
          taxi.active ? el("p", {}, `On shift · ${taxi.fares} fare${taxi.fares === 1 ? "" : "s"}`) : null,
          button(taxi.active ? "End shift" : "Start a shift", "/taxi", !taxi.active)),
        panel("Courier", el("p", {}, "Salieri's back window has sealed envelopes for Yellow Pete. Eight minutes, $180."), button("Check my run", "/courier")),
        data.bootleg?.available ? panel("Bootleg run",
          el("p", {}, `Drive out to the still in the hills, wait while the crates go in, then bring the whisky to Salieri's within ten minutes. ${money(data.bootleg.pay)}. Loading tips off the police.`),
          button(data.bootleg.active ? "Call it off" : "Start a run", data.bootleg.active ? "/bootleg cancel" : "/bootleg", !data.bootleg.active)) : null,
        panel("Hold-ups", el("p", {}, "Draw a gun at a shop counter and /rob it. The police come at once; keep the counter fifteen seconds."),
          (data.robbery ?? []).map((shop) => line(shop.name, shop.readyInSeconds ? `Till empty · ${minutes(shop.readyInSeconds)}` : "Till full"))),
        panel("Turf", el("p", {}, "Crews take street corners by holding them for a minute. Each corner pays its crew every three minutes."),
          (data.turf ?? []).map((turf) => line(`Turf ${turf.id}`, turf.contested ? "Contested" : turf.owner ? turf.owner.name : "Open",
            turf.owner ? el("span", {class: "tag", style: `color:${turf.owner.color}`}, `[${turf.owner.tag}]`) : null))),
        panel("Speed traps", (data.speedtraps ?? []).map((trap) => line(`Trap ${trap.id}`,
          trap.record ? `Record ${trap.record.kmh} km/h by ${trap.record.name}` : "No record yet",
          el("span", {class: "pill gold"}, trap.best ? `You ${trap.best}` : "—")))),
        panel("Cash stashes", el("p", {class: "big"}, `${stashes.found} / ${stashes.total}`),
          el("div", {class: "meter"}, el("span", {style: `width:${Math.round(stashes.found / Math.max(1, stashes.total) * 100)}%`})),
          el("p", {}, "Hidden at the roadside all over town. They only show up close.")),
        panel("Buildings", (data.interiors ?? []).length
          ? data.interiors.map((interior) => line(interior.name, `${interior.kind === "safehouse" ? "Private safehouse" : "Open to everyone"} · ${interior.distance} m`))
          : empty("No doors are open yet. Look for the arrows by building entrances.")));
    }

    function racesPage(data) {
      const races = data.races ?? {routes: [], races: []};
      const inRace = races.races.some((race) => race.joined);
      return el("div", {class: "grid"},
        panel("Live", races.races.length ? races.races.map((race) => line(race.route,
          race.phase === "lobby" ? `Lobby · ${race.racers.join(", ")} · ${race.secondsLeft} s` : `Running · ${race.racers.join(", ")}`,
          race.phase === "lobby" ? (race.joined ? button("Leave", "/race leave") : button("Join", `/race join ${race.id}`, true, inRace)) : null))
          : empty("No race on the streets right now. Pick a route and open one; everyone in town is invited.")),
        data.championship?.available ? panel("Autodrom Championship", data.championship.running
          ? [el("p", {class: "big"}, `${data.championship.running.name}`), el("p", {}, `Round ${data.championship.running.round} of ${data.championship.running.rounds}. Join each round with the race lobby; a race car waits on the grid.`),
            el("div", {class: "lb"}, el("ol", {}, data.championship.running.standings.map((row) => el("li", {}, el("span", {}, row.name), el("b", {}, `${row.points} pts`)))))]
          : [el("p", {}, "Three rounds on the official circuit: a sprint, a feature and a grand prix. Every finish scores; the top three share $5,250."),
            (data.championship.champions ?? []).length ? el("p", {}, `Last champion: ${data.championship.champions[0].name} (${data.championship.champions[0].points} pts)`) : null,
            button("Start a championship", "/championship start", true)]) : null,
        panel("Route book", races.routes.map((route) => line(
          [route.name, route.builtIn ? null : el("span", {class: "pill gold"}, "Player made")],
          `${(route.length / 1000).toFixed(1)} km · ${route.checkpoints} checkpoints${route.record ? ` · record ${clock(route.record.ms)} by ${route.record.name}` : ""}`,
          button("Race", `/race start ${route.index}`, true, inRace), route.mine ? button("Delete", `/race delete ${route.name}`) : null))),
        panel("Record your own",
          races.recording
            ? [el("p", {class: "big"}, races.recording.name), el("p", {}, `${races.recording.checkpoints} checkpoints so far. Drive on and add more.`),
              el("div", {class: "actions"}, button("Checkpoint here", "/race cp", true), button("Undo", "/race undo"), button("Save", "/race save"), button("Discard", "/race discard"))]
            : [el("p", {}, "Sit behind the wheel where the race should start, facing the way it should go."),
              el("div", {class: "form"}, el("input", {id: "route-name", maxlength: "28", placeholder: "Route name"}),
                el("button", {class: "btn primary", type: "button", onclick: () => {
                  const name = document.getElementById("route-name").value.trim();
                  if (name) command(`/race create ${name}`);
                }}, "Start recording"))]));
    }

    function playersPage(data) {
      const list = data.players?.list ?? [];
      const crew = data.crew?.crew;
      return el("div", {}, el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "Player"), el("th", {}, "Rank"), el("th", {}, "Doing"), el("th", {class: "num"}, "Ping"), el("th", {}, ""))),
        el("tbody", {}, list.map((player) => el("tr", {class: player.you ? "you" : ""},
          el("td", {}, crewTag(player.crew), player.name, player.bounty ? el("span", {class: "pill red"}, money(player.bounty)) : null),
          el("td", {}, el("span", {class: "lvl", style: "color:#8c342c;border-color:#8c7b58"}, player.level), player.rank),
          el("td", {}, player.activity ?? (player.spawned ? "Free roaming" : "Choosing a character")),
          el("td", {class: "num"}, `${player.ping} ms`),
          el("td", {}, player.you ? null : el("div", {class: "actions", style: "justify-content:flex-end"},
            button("Go to", `/goto #${player.id}`), button("Duel", `/duel #${player.id} 3`), button("Dice $50", `/dice #${player.id} 50`),
            button("Watch", `/spectate #${player.id}`),
            el("button", {class: "btn", type: "button", onclick: () => startCompose(player)}, "Message"),
            crew && !player.crew ? button("Invite", `/crew invite #${player.id}`) : null)))))),
        el("p", {class: "empty", style: "margin-top:12px"}, "Duels run in a private copy of the city. Stop watching with /spectate off."));
    }

    function crewPage(data) {
      const info = data.crew ?? {};
      const crew = info.crew;
      return el("div", {class: "grid"},
        crew ? panel(`[${crew.tag}] ${crew.name}`,
          el("p", {}, el("span", {class: "tag", style: `color:${crew.color}`}, "■"), `Led by ${crew.leader}. Talk on the crew radio with /c <message>.`),
          crew.members.map((member) => line(member.name, member.online ? "In town" : "Away",
            crew.isLeader && member.name !== crew.leader ? button("Kick", `/crew kick ${member.name}`) : null)),
          el("div", {class: "actions", style: "margin-top:10px"}, button("Leave crew", "/crew leave")))
          : panel("Found a crew",
            el("p", {}, "A crew shares a tag and a colour on nametags and cars, sees its members across the city and has its own radio."),
            el("div", {class: "form"}, el("input", {id: "crew-tag", maxlength: "4", placeholder: "TAG"}), el("input", {id: "crew-name", maxlength: "24", placeholder: "Crew name"}),
              el("button", {class: "btn primary", type: "button", onclick: () => {
                const tag = document.getElementById("crew-tag").value.trim();
                const name = document.getElementById("crew-name").value.trim();
                if (tag) command(`/crew create ${tag} ${name}`);
              }}, "Found"))),
        panel("Crews of Lost Heaven", (info.crews ?? []).length ? info.crews.map((entry) => line([el("span", {class: "tag", style: `color:${entry.color}`}, `[${entry.tag}]`), entry.name],
          `${entry.members} member${entry.members === 1 ? "" : "s"}`)) : empty("No crews yet. Be the first.")));
    }

    function leadersPage(data) {
      const board = data.leaderboard ?? {};
      const column = (title, rows, format) => panel(title, rows?.length
        ? el("div", {class: "lb"}, el("ol", {}, rows.map((row) => el("li", {}, el("span", {}, row.name), el("b", {}, format(row))))))
        : empty("Nobody yet."));
      return el("div", {class: "grid"},
        column("Highest rank", board.level, (row) => `Lv ${row.level}`), column("Richest", board.money, (row) => money(row.value)),
        column("Most kills", board.kills, (row) => row.value), column("Race wins", board.races, (row) => row.value));
    }

    // Lets a long usage wrap after each "|" rather than inside a word.
    function usage(text) {
      return text.split("|").flatMap((part, index) => index ? ["|", el("wbr"), part] : [part]);
    }

    function helpPage(data) {
      const byCategory = new Map();
      for (const entry of data.commands ?? []) {
        if (!byCategory.has(entry.category)) byCategory.set(entry.category, []);
        byCategory.get(entry.category).push(entry);
      }
      return el("div", {class: "grid"},
        panel("Controls", el("div", {class: "keys"},
          el("kbd", {}, "F2"), el("span", {}, "City menu"), el("kbd", {}, "F1"), el("span", {}, "Who is in town (hold)"),
          el("kbd", {}, "Tab"), el("span", {}, "City map"),
          el("kbd", {}, "T"), el("span", {}, "Chat"), el("kbd", {}, "N / B"), el("span", {}, "Browse and buy at a shop counter"),
          el("kbd", {}, "F9"), el("span", {}, "Car radio on or off"), el("kbd", {}, "K"), el("span", {}, "Siren, in a police car"))),
        [...byCategory].map(([category, entries]) => panel(category, entries.map((entry) => el("div", {class: "cmd"}, el("code", {}, usage(entry.usage)), el("span", {}, entry.help))))));
    }

    let composeTarget = null;
    function startCompose(player) {
      composeTarget = player;
      renderMenu();
      setTimeout(() => document.getElementById("compose-text")?.focus(), 0);
    }

    function renderMenu() {
      const box = document.getElementById("menu");
      box.classList.toggle("hidden", !state.menuOpen);
      document.body.classList.toggle("menu-open", state.menuOpen);
      if (!state.menuOpen) return;
      const data = state.data ?? {};
      const pages = {city: cityPage, jobs: jobsPage, races: racesPage, players: playersPage, crew: crewPage, leaders: leadersPage, help: helpPage};
      const keepScroll = box.querySelector(".page")?.scrollTop ?? 0;
      const active = document.activeElement;
      const activeId = active?.id;
      const activeValue = active?.value;
      box.replaceChildren(el("div", {class: "menu", role: "dialog", "aria-modal": "true"},
        el("header", {}, el("span", {class: "seal"}, "LH"),
          el("div", {}, el("p", {class: "eyebrow"}, "Lost Heaven · Free Ride"), el("h2", {}, "City Menu")),
          el("div", {class: "wallet"}, el("b", {}, money(data.you?.money)), data.you ? `${data.you.name} · Level ${data.you.level}` : "Loading…")),
        el("nav", {}, TABS.map(([id, label], index) => el("button", {type: "button", class: state.tab === id ? "active" : "", onclick: () => selectTab(id)},
          el("kbd", {}, index + 1), label))),
        el("div", {class: "page"}, state.data ? pages[state.tab](data) : empty("Asking around town…")),
        el("footer", {}, composeTarget
          ? el("div", {class: "compose"}, el("span", {}, `To ${composeTarget.name}:`),
            el("input", {id: "compose-text", maxlength: "120", placeholder: "Write a private message", onkeydown: (event) => {
              if (event.key === "Enter") sendCompose();
            }}), el("button", {class: "btn primary", type: "button", onclick: sendCompose}, "Send"),
            el("button", {class: "btn", type: "button", onclick: () => { composeTarget = null; renderMenu(); }}, "Cancel"))
          : [el("span", {}, "Every button runs the same command you could type in chat."), el("span", {style: "margin-left:auto"}, "Esc or F2 to close")])));
      const page = box.querySelector(".page");
      if (page) page.scrollTop = keepScroll;
      if (activeId) {
        const restored = document.getElementById(activeId);
        if (restored) { if (activeValue !== undefined) restored.value = activeValue; restored.focus(); }
      }
    }
    function sendCompose() {
      const input = document.getElementById("compose-text");
      const text = input?.value.trim();
      if (composeTarget && text) command(`/pm #${composeTarget.id} ${text}`);
      composeTarget = null;
      renderMenu();
    }
    function selectTab(tab) {
      state.tab = tab;
      composeTarget = null;
      send("hud:tab", {tab});
      renderMenu();
    }
    on("menu:open", ({tab}) => { state.menuOpen = true; if (tab) state.tab = tab; renderMenu(); });
    on("menu:close", () => { state.menuOpen = false; composeTarget = null; renderMenu(); });
    on("menu:data", (data) => {
      state.data = data;
      const typing = document.activeElement?.tagName === "INPUT" && document.activeElement.value;
      if (!typing) renderMenu();
    });
    document.addEventListener("keydown", (event) => {
      if (!state.menuOpen) return;
      if (event.key === "Escape" || event.key === "F2") { event.preventDefault(); send("hud:close"); return; }
      if (document.activeElement?.tagName === "INPUT") return;
      const index = Number(event.key) - 1;
      if (Number.isInteger(index) && TABS[index]) selectTab(TABS[index][0]);
    });
  </script>
</body>
</html>
