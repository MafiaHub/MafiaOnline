<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost Heaven Motor Pool</title>
  <style>
    /* The main UI's faces (resources/ui): Inter for text, Playfair Display
       for titles. Inter has no 700: bold text asks for 600. */
    @font-face { font-family: Inter; font-weight: 400; font-display: swap; src: url(fonts/inter-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: Inter; font-weight: 400; font-display: swap; src: url(fonts/inter-latin-ext-400-normal.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    @font-face { font-family: Inter; font-weight: 500; font-display: swap; src: url(fonts/inter-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: Inter; font-weight: 500; font-display: swap; src: url(fonts/inter-latin-ext-500-normal.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    @font-face { font-family: Inter; font-weight: 600; font-display: swap; src: url(fonts/inter-latin-600-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: Inter; font-weight: 600; font-display: swap; src: url(fonts/inter-latin-ext-600-normal.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    @font-face { font-family: "Playfair Display"; font-weight: 700; font-display: swap; src: url(fonts/playfair-display-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: "Playfair Display"; font-weight: 700; font-display: swap; src: url(fonts/playfair-display-latin-ext-700-normal.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    /* Clean noir, as the main UI (ui/src/tokens.stylex.ts). The stage stays
       transparent: the game draws the car behind it. */
    :root {
      --bg: #0b0b0c;
      --panel: #111112;
      --raised: #1a1a1b;
      --hover: #242425;
      --border: #2c2c2e;
      --border-strong: #4a4a4c;
      --line: #77746f;
      --text: #ece8e1;
      --soft: #c6c2bb;
      --muted: #9b9892;
      --faint: #64625e;
      --accent: #a3201c;
      --accent-hover: #c42b25;
      --accent-soft: rgba(163, 32, 28, .2);
      --ease: cubic-bezier(.2, .7, .2, 1);
      --serif: "Playfair Display", Georgia, serif;
      --sans: Inter, "Segoe UI", Arial, sans-serif;
      /* 13px at 800x600, 14px at 1080p, up to 28px at 4K. */
      font-size: clamp(13px, min(1.3vh, .95vw), 28px);
      font-family: var(--sans);
      font-feature-settings: "lnum" 1;
      color: var(--text);
      color-scheme: dark;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { display: grid; place-items: center; }
    button, input { font: inherit; }
    ::selection { background: rgba(163, 32, 28, .7); color: #fff; }
    .catalog {
      display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
      width: min(78rem, calc(100vw - 32px)); height: min(48rem, calc(100vh - 32px));
      border: 1px solid var(--line); background: transparent;
      box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .55);
      animation: rise .18s var(--ease);
    }
    @keyframes rise { from { opacity: 0; transform: translateY(.25rem); } }
    .masthead { display: flex; align-items: center; gap: 1rem; min-width: 0; padding: 1rem 1.4rem .95rem; border-bottom: 3px double var(--line); background: var(--panel); }
    .seal { display: grid; place-items: center; flex: none; width: 2.75rem; height: 2.75rem; border: 1px solid var(--line); box-shadow: inset 0 0 0 3px var(--panel), inset 0 0 0 4px var(--border-strong); color: var(--text); font: 700 .95rem/1 var(--serif); letter-spacing: .02em; }
    .edition { margin: 0 0 .3rem; color: var(--muted); font: 600 .66rem/1.2 var(--sans); letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--text); font: 700 clamp(22px, 2.4vw, 1.9rem)/1.05 var(--serif); }
    .masthead .count { margin-left: auto; color: var(--muted); font: 500 .78rem/1 var(--sans); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .content { display: grid; grid-template-columns: clamp(230px, 29%, 22rem) minmax(0, 1fr); min-height: 0; }
    .sidebar { display: flex; flex-direction: column; min-height: 0; padding: 1rem; border-right: 1px solid var(--border); background: var(--panel); }
    .sidebar label { color: var(--muted); font: 600 .68rem/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; }
    .search { flex: none; width: 100%; height: 2.4rem; margin: .5rem 0 .75rem; padding: 0 .75rem; border: 1px solid var(--border); outline: none; background: var(--bg); color: var(--text); font: 400 .95rem var(--sans); caret-color: var(--accent-hover); }
    .search::placeholder { color: var(--faint); }
    .search:focus { border-color: var(--line); box-shadow: inset 3px 0 0 var(--accent-hover); }
    .list { min-height: 0; overflow-y: auto; margin: 0 -1rem; border-top: 1px solid var(--border); scrollbar-color: var(--border-strong) transparent; }
    .list::-webkit-scrollbar { width: 6px; } .list::-webkit-scrollbar-thumb { background: var(--border-strong); }
    .entry { display: block; width: 100%; padding: .6rem 1rem .62rem; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--soft); text-align: left; cursor: pointer; outline: none; transition: background-color .12s var(--ease); }
    .entry:hover, .entry:focus-visible { background: var(--raised); color: var(--text); }
    .entry.selected { background: var(--accent-soft); color: var(--text); box-shadow: inset 3px 0 0 var(--accent-hover); }
    .entry .name { display: block; font: 500 .92rem/1.25 var(--sans); }
    .entry .file { display: block; margin-top: .2rem; color: var(--muted); font: 400 .7rem/1.2 var(--sans); }
    .empty { padding: .9rem 1rem; color: var(--muted); font: 400 .86rem/1.4 var(--sans); }
    .preview-column { display: flex; flex-direction: column; min-height: 0; background: transparent; }
    .preview-head { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; padding: .8rem 1.1rem .75rem; background: var(--panel); border-bottom: 1px solid var(--border); }
    .preview-head .label { color: var(--text); font: 600 .68rem/1.2 var(--sans); letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; }
    .preview-head .stock { min-width: 0; color: var(--muted); font: 400 .74rem/1.2 var(--sans); text-align: right; }
    .stage { position: relative; min-height: 0; flex: 1; overflow: hidden; border: 0; background: transparent; cursor: grab; touch-action: none; }
    .stage:active { cursor: grabbing; }
    /* Corner marks frame the car like a showroom photograph. */
    .stage::after { content: ''; position: absolute; inset: .75rem; pointer-events: none;
      background:
        linear-gradient(var(--text), var(--text)) top left / 1.25rem 1px no-repeat, linear-gradient(var(--text), var(--text)) top left / 1px 1.25rem no-repeat,
        linear-gradient(var(--text), var(--text)) top right / 1.25rem 1px no-repeat, linear-gradient(var(--text), var(--text)) top right / 1px 1.25rem no-repeat,
        linear-gradient(var(--text), var(--text)) bottom left / 1.25rem 1px no-repeat, linear-gradient(var(--text), var(--text)) bottom left / 1px 1.25rem no-repeat,
        linear-gradient(var(--text), var(--text)) bottom right / 1.25rem 1px no-repeat, linear-gradient(var(--text), var(--text)) bottom right / 1px 1.25rem no-repeat;
      opacity: .55; }
    .stage .number { position: absolute; top: 1.35rem; left: 2.5rem; color: var(--text); text-shadow: 0 1px 2px #000, 0 0 8px rgba(0, 0, 0, .6); font: 600 .7rem/1 var(--sans); letter-spacing: .2em; font-variant-numeric: tabular-nums; pointer-events: none; }
    .preview-title { padding: .85rem 1.1rem .9rem; background: var(--panel); border-top: 1px solid var(--border); color: var(--text); font: 700 clamp(19px, 2.1vw, 1.65rem)/1.1 var(--serif); overflow-wrap: anywhere; }
    .preview-title small { display: block; margin-top: .35rem; color: var(--muted); font: 400 .76rem/1.3 var(--sans); }
    .footer { display: flex; align-items: center; gap: 1rem; min-width: 0; padding: .7rem 1.1rem .7rem 1.4rem; border-top: 1px solid var(--border); background: var(--panel); }
    .status { flex: 1; min-width: 0; margin: 0; color: var(--soft); font: 400 .82rem/1.35 var(--sans); }
    .actions { display: flex; gap: .5rem; flex: none; }
    .actions button { display: inline-flex; align-items: center; justify-content: center; min-height: 2.4rem; padding: 0 1.1rem; border: 1px solid var(--border-strong); background: transparent; color: var(--text); font: 600 .72rem/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; cursor: pointer; outline: none; transition: transform .12s var(--ease); }
    .actions button:hover:not(:disabled) { border-color: var(--text); background: var(--raised); }
    .actions button:focus-visible { border-color: var(--text); box-shadow: inset 3px 0 0 var(--accent-hover); }
    .actions button:active:not(:disabled) { transform: translateY(1px); }
    .actions .choose { background: var(--accent); border-color: var(--accent); }
    .actions .choose:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
    .actions .choose:focus-visible { box-shadow: inset 0 0 0 1px var(--text); }
    .actions button:disabled { opacity: .4; cursor: default; }
    @media (max-width: 720px) {
      .masthead { padding: .65rem .9rem; }
      .content { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(125px, 33%) minmax(0, 1fr); }
      .sidebar { padding: .6rem; border-right: 0; border-bottom: 1px solid var(--border); }
      .list { margin: 0 -.6rem; }
      .search { height: 2.1rem; margin: .35rem 0 .45rem; }
      .entry { padding: .45rem .6rem; }
      .preview-head { padding: .5rem .7rem; }
      .preview-title { padding: .5rem .7rem; }
      .footer { padding: .55rem .7rem; }
      .footer .status { font-size: .74rem; }
      .actions button { padding: 0 .65rem; }
    }
    @media (max-height: 620px) {
      .masthead { padding-top: .6rem; padding-bottom: .55rem; } .seal { width: 2.3rem; height: 2.3rem; }
      .preview-head { padding-top: .5rem; padding-bottom: .45rem; } .preview-title { padding-top: .5rem; padding-bottom: .55rem; }
      .footer { padding-top: .5rem; padding-bottom: .5rem; }
    }
  </style>
</head>
<body>
  <main class="catalog" role="dialog" aria-modal="true" aria-labelledby="catalog-title">
    <header class="masthead">
      <span class="seal" aria-hidden="true">LH</span>
      <div><p class="edition" id="edition">Lost Heaven · Motor Pool</p><h1 id="catalog-title">Choose your car</h1></div>
      <span class="count" id="count">Loading catalog…</span>
    </header>
    <div class="content">
      <section class="sidebar" aria-label="Available cars">
        <label for="search">Find a model</label>
        <input class="search" id="search" type="search" placeholder="Name or model" autocomplete="off" spellcheck="false">
        <div class="list" id="list" role="listbox" aria-label="Stock car models"></div>
      </section>
      <section class="preview-column" aria-label="Car preview">
        <div class="preview-head"><span class="label">Showroom preview</span><span class="stock">Stock model · Drag to rotate · Scroll to zoom</span></div>
        <div class="stage" id="stage"><span class="number" id="number"></span></div>
        <div class="preview-title" id="selected">Select a car<small>All models come from the retail catalog.</small></div>
      </section>
    </div>
    <footer class="footer">
      <p class="status" id="status">Choose a model and take the wheel.</p>
      <div class="actions"><button type="button" id="cancel">Close</button><button class="choose" type="button" id="choose" disabled>Drive this car</button></div>
    </footer>
  </main>
  <script>
    const list = document.getElementById("list");
    const search = document.getElementById("search");
    const stage = document.getElementById("stage");
    const count = document.getElementById("count");
    const selected = document.getElementById("selected");
    const number = document.getElementById("number");
    const status = document.getElementById("status");
    const choose = document.getElementById("choose");
    let state = {models: [], selectedId: null, previewReady: false, pending: false, message: ""};
    let pointerX = null;

    function send(name, payload = {}) {
      if (typeof callEvent === "function") callEvent(name, JSON.stringify(payload));
    }
    function visibleModels() {
      const query = search.value.trim().toLocaleLowerCase();
      return state.models.filter((model) => `${model.name} ${model.model}`.toLocaleLowerCase().includes(query));
    }
    function reportViewport() {
      const rect = stage.getBoundingClientRect();
      send("car:viewport", {x: rect.x, y: rect.y, width: rect.width, height: rect.height,
        pageWidth: window.innerWidth, pageHeight: window.innerHeight});
    }
    function render() {
      const models = visibleModels();
      const scrollTop = list.scrollTop;
      const active = state.models.find((model) => model.id === state.selectedId);
      list.replaceChildren();
      for (const model of models) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `entry${model.id === state.selectedId ? " selected" : ""}`;
        button.setAttribute("role", "option");
        button.setAttribute("aria-selected", String(model.id === state.selectedId));
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = model.name;
        const file = document.createElement("span");
        file.className = "file";
        file.textContent = model.note ?? model.model;
        button.append(name, file);
        button.addEventListener("click", () => send("car:select", {id: model.id}));
        list.append(button);
      }
      if (!models.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No cars match that search.";
        list.append(empty);
      }
      list.scrollTop = scrollTop;
      count.textContent = `${models.length} of ${state.models.length} models`;
      selected.replaceChildren(document.createTextNode(active?.name ?? "Select a car"));
      const subtitle = document.createElement("small");
      subtitle.textContent = active?.note ?? active?.model ?? "All models come from the retail catalog.";
      selected.append(subtitle);
      number.textContent = active ? `MODEL ${String(active.id).padStart(2, "0")}` : "";
      status.textContent = state.message || "Choose a model and take the wheel.";
      choose.disabled = state.pending || !state.previewReady || Boolean(active?.disabled);
      choose.textContent = state.pending ? "One moment…" : active?.action ?? "Drive this car";
      if (state.edition) document.getElementById("edition").textContent = state.edition;
      if (state.title) document.getElementById("catalog-title").textContent = state.title;
    }
    window.addEventListener("car:state", ({detail}) => {
      if (!detail || !Array.isArray(detail.models)) return;
      state = detail;
      render();
      reportViewport();
    });
    search.addEventListener("input", render);
    document.getElementById("cancel").addEventListener("click", () => send("car:close"));
    choose.addEventListener("click", () => send("car:choose"));
    stage.addEventListener("pointerdown", (event) => { pointerX = event.clientX; stage.setPointerCapture(event.pointerId); });
    stage.addEventListener("pointermove", (event) => {
      if (pointerX === null) return;
      const dx = event.clientX - pointerX;
      pointerX = event.clientX;
      if (dx) send("car:rotate", {dx});
    });
    stage.addEventListener("pointerup", () => { pointerX = null; });
    stage.addEventListener("pointercancel", () => { pointerX = null; });
    stage.addEventListener("wheel", (event) => { event.preventDefault(); send("car:zoom", {delta: event.deltaY}); }, {passive: false});
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") { event.preventDefault(); send("car:close"); return; }
      if (event.key === "Enter") { event.preventDefault(); if (!choose.disabled) send("car:choose"); return; }
      if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
      event.preventDefault();
      const models = visibleModels();
      if (!models.length) return;
      const index = models.findIndex((model) => model.id === state.selectedId);
      const next = models[(index + (event.key === "ArrowDown" ? 1 : -1) + models.length) % models.length];
      send("car:select", {id: next.id});
    });
    new ResizeObserver(reportViewport).observe(stage);
    window.addEventListener("resize", reportViewport);
  </script>
</body>
</html>
